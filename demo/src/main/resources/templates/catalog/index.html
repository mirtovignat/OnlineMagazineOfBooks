<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title th:text="${catalog.metadata.pageTitle} + ' — Cinema Service'">Каталог — Cinema Service</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <style>
        html {
            height: auto !important;
            min-height: 100%;
            overflow-y: scroll !important;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        main.catalog-wrapper {
            display: block;
            padding: 1.5rem 2rem 4rem 2rem;
            box-sizing: border-box;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            min-height: calc(100vh - 120px);
        }

        .catalog-header {
            text-align: center;
            padding: 0.5rem 0 1.5rem 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .catalog-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e0e7ff, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
        }

        .catalog-count {
            background: rgba(255, 255, 255, 0.08);
            padding: 0.3rem 1rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            font-size: 0.85rem;
        }

        .catalog-content-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>
<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>

<main class="catalog-wrapper">
    <div class="catalog-header">
        <h1 th:text="${catalog.metadata.pageTitle}">Каталог</h1>
        <div class="catalog-count" th:if="${catalog.items != null}">
            Всего: <strong th:text="${#lists.size(catalog.items)}">0</strong>
        </div>
    </div>

    <div class="catalog-content-container" th:if="${catalog.items != null and not #lists.isEmpty(catalog.items)}">
        <th:block th:replace="~{catalog/${catalog.metadata.viewType} :: view(items=${catalog.items})}"></th:block>
    </div>

    <div th:if="${catalog.items == null or #lists.isEmpty(catalog.items)}"
         style="text-align: center; padding: 4rem 2rem; color: #94a3b8;">
        <p th:text="${catalog.metadata.emptyText}" style="font-size: 1.2rem; margin-bottom: 1.5rem;">Список пуст</p>
        <a href="/" class="watch-btn-library" style="display: inline-block; width: auto; padding: 0.75rem 2rem;">Перейти
            в каталог</a>
    </div>
</main>

<script th:src="@{/js/main.js}" defer></script>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
