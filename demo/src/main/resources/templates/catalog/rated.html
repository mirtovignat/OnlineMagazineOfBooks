<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>⭐ История оценок — Cinema Service</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <style>
        html {
            height: auto !important;
            min-height: 100%;
            overflow-y: scroll !important;
        }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        main.catalog-wrapper {
            display: block;
            padding: 1.5rem 2rem 4rem 2rem;
            box-sizing: border-box;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            min-height: calc(100vh - 120px);
        }
        .catalog-header {
            text-align: center;
            padding: 0.5rem 0 1.5rem 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        .catalog-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e0e7ff, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
        }
        .catalog-count {
            background: rgba(255, 255, 255, 0.08);
            padding: 0.3rem 1rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            font-size: 0.85rem;
        }
        .rated-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin: 0 auto;
        }
        .rated-card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(250, 204, 21, 0.2);
            border-radius: 12px;
            padding: 0.5rem 0.9rem;
            display: flex;
            gap: 1rem;
            backdrop-filter: blur(12px);
            align-items: center;
            box-sizing: border-box;
            transition: border-color 0.2s, transform 0.2s;
        }
        .rated-card:hover {
            border-color: rgba(250, 204, 21, 0.5);
            transform: translateY(-2px);
        }
        .rated-poster {
            width: 50px;
            height: 72px;
            border-radius: 6px;
            overflow: hidden;
            background: #0f172a;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .rated-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .rated-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            min-width: 0;
        }
        .rated-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .rated-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f8fafc;
            text-decoration: none;
            transition: color 0.2s;
        }
        .rated-title:hover {
            color: #facc15;
        }
        .rated-details {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .user-score-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.3);
            color: #fde047;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 14px;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .rated-review-box {
            background: rgba(30, 41, 59, 0.5);
            border-left: 3px solid #facc15;
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            color: #e2e8f0;
            line-height: 1.25;
            border-radius: 0 6px 6px 0;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .rated-date {
            font-size: 0.7rem;
            color: #64748b;
        }
        .movie-poster-placeholder {
            width: 100%;
            height: 100%;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 0.65rem;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #94a3b8;
        }
        .empty-state p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .watch-btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #facc15;
            color: #0b0f19;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .watch-btn:hover {
            background: #fde047;
        }
    </style>
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>
<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>

<main class="catalog-wrapper">
    <div class="catalog-header">
        <h1>⭐ История оценок</h1>
        <div class="catalog-count" th:if="${items != null}">
            Всего: <strong th:text="${#lists.size(items)}">0</strong>
        </div>
    </div>

    <div th:if="${items != null and not #lists.isEmpty(items)}" class="rated-container">
        <div th:each="item : ${items}" class="rated-card">
            <div class="rated-poster">
                <img th:if="${item.posterUrl != null and !item.posterUrl.isEmpty()}"
                     th:src="${item.posterUrl}" alt="Постер"/>
                <div th:unless="${item.posterUrl != null and !item.posterUrl.isEmpty()}"
                     class="movie-poster-placeholder">Нет фото
                </div>
            </div>

            <div class="rated-content">
                <div class="rated-header">
                    <a th:href="@{/movies/{id}(id=${item.id})}" class="rated-title" th:text="${item.title}">Название
                        фильма</a>
                    <div class="user-score-badge">
                        <span>★</span>
                        <span th:text="${item.ratingValue}">9</span>/10
                    </div>
                </div>

                <div class="rated-details">
                    <span th:text="${item.genre != null ? item.genre : '—'}">Жанр</span> •
                    <span th:text="${item.releaseDate != null ? item.releaseDate.year : '—'}">2026</span> •
                    <span>Общий рейтинг: <strong style="color: #f8fafc;"
                                                 th:text="${item.rating != null ? #numbers.formatDecimal(item.rating, 1, 1) : '—'}">8.5</strong></span>
                </div>

                <div class="rated-review-box" th:if="${item.review != null and !#strings.isEmpty(item.review)}">
                    <span th:text="${item.review}">Отличный фильм!</span>
                </div>
                <div style="font-size: 0.7rem; color: #64748b; font-style: italic;"
                     th:if="${item.review == null or #strings.isEmpty(item.review)}">
                    без текстового отзыва
                </div>

                <div class="rated-date" th:if="${item.addedAt != null}">
                    Оценено: <span th:text="${#temporals.format(item.addedAt, 'dd MMMM yyyy')}">15 марта 2026</span>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${items == null or #lists.isEmpty(items)}" class="empty-state">
        <p>Вы не оценили ни один фильм</p>
        <a href="/" class="watch-btn">Перейти в каталог</a>
    </div>
</main>

<script th:src="@{/js/main.js}" defer></script><th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
