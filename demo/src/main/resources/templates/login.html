<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Вход — Cinema Service</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            color: #eef2ff;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
        }
        :root {
            --glass-bg: rgba(18, 25, 45, 0.65);
            --glass-border: rgba(72, 187, 255, 0.25);
            --glow-primary: #3b82f6;
            --glow-success: #10b981;
            --glow-danger: #f43f5e;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.75);
            --shadow-xl: 0 25px 45px -12px rgba(0,0,0,0.5);
            --radius-xl: 28px;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-xl);
            padding: 2rem;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-xl);
            margin: auto 0;
        }

        h1 { text-align: center; font-size: 1.8rem; margin-bottom: 1.5rem; background: linear-gradient(135deg, #e0e7ff, #c084fc); -webkit-background-clip: text; background-clip: text; color: transparent; }

        .logo-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
            justify-content: center;
            width: 100%;
        }
        .logo-link img { width: 28px; height: 28px; border-radius: 10px; }

        label { display: block; margin-top: 0.8rem; margin-bottom: 0.3rem; font-weight: 500; font-size: 0.9rem; }
        .input-container { position: relative; width: 100%; margin-bottom: 0.5rem; }
        input {
            width: 100%;
            padding: 0.8rem 2.5rem 0.8rem 1rem;
            border-radius: 60px;
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: var(--glow-primary); box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }

        button[type="submit"] {
            width: 100%;
            margin-top: 1.2rem;
            padding: 0.8rem;
            background: linear-gradient(135deg, var(--glow-primary), #1d4ed8);
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59,130,246,0.4); }

        .toggle-password-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .login-footer { text-align: center; margin-top: 1.5rem; }
        .login-footer a { color: #c084fc; text-decoration: none; }
        .login-footer a:hover { text-decoration: underline; }

        .flash-messages-container {
            margin-bottom: 1rem;
        }
        .flash-message {
            padding: 0.8rem 1rem;
            border-radius: 60px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            font-size: 0.85rem;
            border-left: 4px solid;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            color: #eef2ff;
        }
        .flash-message.error { border-color: var(--glow-danger); color: #fecdd3; }
        .flash-message.success { border-color: var(--glow-success); color: #a7f3d0; }
        .flash-message.info { border-color: var(--glow-primary); color: #bfdbfe; }

        .close-btn {
            background: none;
            border: none;
            color: inherit;
            font-size: 1.3rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 0 0 0 10px;
        }
        .close-btn:hover { opacity: 1; }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; height: 0; margin: 0; padding: 0; overflow: hidden; }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo-link"><a href="/"><img src="/favicon.ico" alt="">Cinema Service</a></div>
    <h1>Вход</h1>

    <div class="flash-messages-container" id="flash-messages-container">
        <div th:if="${successMessage}" class="flash-message success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="flash-message error" th:text="${errorMessage}"></div>
        <div th:if="${infoMessage}" class="flash-message info" th:text="${infoMessage}"></div>
        <div th:if="${userNotFoundExceptionMessage}" class="flash-message error" th:text="${userNotFoundExceptionMessage}"></div>
        <div th:if="${invalidPasswordExceptionMessage}" class="flash-message error" th:text="${invalidPasswordExceptionMessage}"></div>
        <div th:if="${exceptionMessage}" class="flash-message error" th:text="${exceptionMessage}"></div>
    </div>

    <form th:action="@{/login}" th:object="${loginForm}" method="post" id="loginForm">
        <input type="hidden" id="identifierType" th:field="*{identifier}" value="USERNAME"/>

        <label for="identifierValue">Username, email или phone</label>
        <div class="input-container">
            <input id="identifierValue" th:field="*{identifierValue}" type="text"
                   placeholder="username, email или +380..." required/>
        </div>

        <label for="loginPassword">Пароль</label>
        <div class="input-container">
            <input id="loginPassword" th:field="*{rawPassword}" type="password" required minlength="8"/>
            <button type="button" id="loginTogglePasswordBtn" onclick="togglePassword()" class="toggle-password-btn">
                <i id="loginPasswordToggleIcon" class="fas fa-eye-slash"></i>
            </button>
        </div>

        <button type="submit">Войти</button>
    </form>

    <div class="login-footer"><a th:href="@{/register}">Создать аккаунт</a></div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script>
    function togglePassword() {
        const pwd = document.getElementById('loginPassword');
        const icon = document.getElementById('loginPasswordToggleIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        } else {
            pwd.type = 'password';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        }
    }

    function detectIdentifierType(value) {
        if (!value || value.trim() === '') {
            return 'USERNAME';
        }
        const trimmed = value.trim();

        if (trimmed.includes('@')) {
            return 'EMAIL';
        }

        if (trimmed.match(/^\+?[\d\s\-()]{7,15}$/)) {
            return 'PHONE';
        }
        return 'USERNAME';
    }

    document.addEventListener('DOMContentLoaded', function() {
        const identifierValue = document.getElementById('identifierValue');
        const identifierType = document.getElementById('identifierType');

        if (identifierValue && identifierType) {
            if (identifierValue.value) {
                identifierType.value = detectIdentifierType(identifierValue.value);
            }
            identifierValue.addEventListener('input', function() {
                identifierType.value = detectIdentifierType(this.value);
            });
        }
    });

    setTimeout(() => {
        document.querySelectorAll('#flash-messages-container .flash-message').forEach(msg => {
            setTimeout(() => {
                msg.style.transition = 'opacity 0.5s ease';
                msg.style.opacity = '0';
                setTimeout(() => msg.remove(), 500);
            }, 5000);
        });
    }, 100);
</script>

</body>
</html>
