<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки профиля — Cinema Service</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .settings-container { max-width: 680px; margin: 2rem auto; padding: 0 1.5rem; }
        .settings-header { margin-bottom: 2rem; }
        .settings-header h1 { font-size: 2.2rem; font-weight: 700; background: linear-gradient(135deg, #e0e7ff, #c084fc); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.3px; }
        .settings-card { background: var(--card-bg); backdrop-filter: blur(12px); border-radius: var(--radius-xl); border: 1px solid var(--glass-border); padding: 2rem; box-shadow: var(--shadow-xl); }
        .user-badge { background: rgba(0, 0, 0, 0.4); border-radius: 24px; padding: 1rem 1.5rem; margin-bottom: 2rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; border: 1px solid rgba(255,255,255,0.05); }
        .user-badge-item { display: flex; align-items: baseline; gap: 0.5rem; font-size: 0.9rem; }
        .user-badge-label { color: var(--text-muted); font-weight: 500; }
        .user-badge-value { color: var(--text-light); font-weight: 600; }
        .user-badge-balance { color: var(--glow-success); font-weight: 700; }
        .form-group { margin-bottom: 1.75rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
        .form-control { width: 100%; padding: 0.9rem 1.2rem; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--glass-border); border-radius: 60px; font-size: 1rem; color: var(--text-light); transition: all 0.2s; font-family: inherit; }
        .form-control:focus { outline: none; border-color: var(--glow-primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.2); background: rgba(0,0,0,0.7); }
        .form-control.is-invalid { border-color: var(--glow-danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.2); }
        .field-error { color: var(--glow-danger); font-size: 0.75rem; margin-top: 0.4rem; padding-left: 1rem; display: none; }
        .field-error.show { display: block; margin-bottom: 0.5rem; }
        .general-error { background: rgba(239,68,68,0.1); border: 1px solid var(--glow-danger); border-radius: 12px; padding: 0.75rem 1.2rem; margin-bottom: 1.5rem; color: var(--glow-danger); font-size: 0.9rem; display: none; }
        .general-error.show { display: block; }
        .form-actions { display: flex; gap: 1rem; margin-top: 2rem; }
        .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; padding: 0.9rem 1.5rem; border-radius: 60px; font-weight: 600; font-size: 0.95rem; text-decoration: none; border: none; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .btn-primary { background: linear-gradient(135deg, var(--glow-primary), #1d4ed8); color: white; box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59,130,246,0.4); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text-light); border: 1px solid var(--glass-border); }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
        @media (max-width: 550px) { .settings-card { padding: 1.5rem; } .form-actions { flex-direction: column; } .user-badge { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>
<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>

<main class="settings-container">
    <div class="settings-header"><h1>Настройки профиля</h1></div>
    <div class="settings-card">
        <div class="user-badge" th:if="${wallet != null}">
            <div class="user-badge-item" th:if="${wallet.fullName != null}">
                <span class="user-badge-label">Полное имя:</span>
                <span class="user-badge-value" th:text="${wallet.fullName}">—</span>
            </div>
            <div class="user-badge-item">
                <span class="user-badge-label">Баланс:</span>
                <span class="user-badge-balance" th:text="${wallet.balance} + ' ₽'">0 ₽</span>
            </div>
        </div>

        <div id="generalError" class="general-error"></div>

        <form th:action="@{/profile/settings/change}" th:object="${profileSettingsDTO}" method="post" id="settingsForm">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" class="form-control" th:field="*{username}" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"/>
                <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="field-error show"></div>
                <div id="usernameError" class="field-error"></div>
            </div>
            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email" id="email" class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"/>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error show"></div>
                <div id="emailError" class="field-error"></div>
            </div>
            <div class="form-group">
                <label for="phone">Номер телефона</label>
                <input type="tel" id="phone" class="form-control" th:field="*{phone}" placeholder="+7 (999) 123-45-67" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"/>
                <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="field-error show"></div>
                <div id="phoneError" class="field-error"></div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                <a href="/personal-account" class="btn btn-secondary">Перейти в личный кабинет</a>
            </div>
        </form>
    </div>
</main>

<script th:src="@{/js/main.js}" defer></script>
<script>
    function formatPhone(input) {
        let digits = input.value.replace(/\D/g, '');
        if (digits.startsWith('8') || digits.startsWith('7')) {
            digits = '7' + digits.substring(1);
        } else if (digits.length > 0) {
            digits = '7' + digits;
        }
        digits = digits.substring(0, 11);
        let formatted = '';
        if (digits.length > 0) formatted = '+7';
        if (digits.length > 1) formatted += ' (' + digits.substring(1, 4);
        if (digits.length >= 4) formatted += ')';
        if (digits.length > 4) formatted += ' ' + digits.substring(4, 7);
        if (digits.length > 7) formatted += '-' + digits.substring(7, 9);
        if (digits.length > 9) formatted += '-' + digits.substring(9, 11);
        input.value = formatted;
    }

    document.addEventListener('DOMContentLoaded', function () {
        const phone = document.getElementById('phone');
        if (phone) {
            phone.addEventListener('input', function () { formatPhone(this); });
            if (phone.value) formatPhone(phone);
        }
    });
</script>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
