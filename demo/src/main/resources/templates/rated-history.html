<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои оценки — Cinema Service</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .history-container{max-width:1200px;margin:2rem auto;padding:0 2rem;}
        .history-container h1{font-size:2.5rem;font-weight:700;background:linear-gradient(135deg,#e0e7ff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2rem;}
        .history-table{width:100%;border-collapse:separate;border-spacing:0 0.75rem;}
        .history-table thead th{text-align:left;padding:1rem 0.5rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;font-size:0.8rem;letter-spacing:0.5px;}
        .history-table tbody tr{background:var(--card-bg);backdrop-filter:blur(4px);border-radius:20px;transition:all 0.2s;}
        .history-table tbody tr:hover{transform:scale(1.005);box-shadow:0 8px 20px rgba(0,0,0,0.3);}
        .history-table td{padding:1rem 0.5rem;border-top:1px solid rgba(255,255,255,0.05);vertical-align:middle;}
        .history-table td:first-child{border-top-left-radius:20px;border-bottom-left-radius:20px;}
        .history-table td:last-child{border-top-right-radius:20px;border-bottom-right-radius:20px;}
        .movie-link{color:#c084fc;font-weight:600;text-decoration:none;}.movie-link:hover{text-decoration:underline;}
        .rating-value{display:inline-block;background:#fbbf24;color:#1e1b2f;font-weight:700;padding:0.2rem 0.6rem;border-radius:40px;font-size:0.85rem;}
        .film-rating{color:#fcd34d;font-weight:500;}
        .review-text{max-width:250px;white-space:normal;word-break:break-word;font-size:0.9rem;color:#cbd5e1;}
        .poster-thumb{width:50px;height:75px;object-fit:cover;border-radius:8px;background:#2d3748;}
        .poster-placeholder{width:50px;height:75px;background:#2d3748;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.6rem;color:#718096;}
        .movie-meta-info{font-size:0.75rem;color:#7e8a98;margin-top:4px;}
        .movie-meta-info span{margin-right:6px;}
        .empty-state{text-align:center;padding:4rem 2rem;background:var(--card-bg);border-radius:32px;border:1px solid var(--glass-border);}
        .empty-state p{color:var(--text-muted);font-size:1.2rem;margin-bottom:2rem;}
        .btn{background:var(--glow-primary);color:white;padding:0.9rem 2.2rem;border-radius:60px;text-decoration:none;font-weight:600;display:inline-block;transition:0.2s;}
        .btn:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(59,130,246,0.4);}
        .rating-star{color:#facc15;}
        @media (max-width:768px){
            .history-table,.history-table thead,.history-table tbody,.history-table tr,.history-table td{display:block;}
            .history-table thead{display:none;}
            .history-table tbody tr{margin-bottom:1rem;padding:1rem;border-radius:20px;}
            .history-table td{padding:0.5rem 0;border:none;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;}
            .history-table td::before{content:attr(data-label);font-weight:600;color:var(--text-muted);width:35%;flex-shrink:0;}
            .review-text{max-width:65%;}
            .poster-thumb,.poster-placeholder{width:40px;height:60px;}
        }
    </style>
</head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>
<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>
<main class="history-container">
    <h1>Мои оценки фильмов</h1>
    <div th:if="${ratedHistory != null and not ratedHistory.empty}">
        <table class="history-table">
            <thead>
            <tr>
                <th>Постер</th>
                <th>Название</th>
                <th>Моя оценка</th>
                <th>Мой отзыв</th>
                <th>Дата оценки</th>
                <th>Рейтинг фильма</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="rated : ${ratedHistory.content}">
                <td data-label="Постер">
                    <img th:if="${rated.posterUrl != null and !rated.posterUrl.isEmpty()}"
                         th:src="${rated.posterUrl}" class="poster-thumb" alt="Постер" src=""/>
                    <div th:unless="${rated.posterUrl != null and !rated.posterUrl.isEmpty()}"
                         class="poster-placeholder">Нет</div>
                </td>
                <td data-label="Название">
                    <a th:href="@{/movies/{id}(id=${rated.id})}" class="movie-link"
                       th:text="${rated.title}">Название</a>
                    <div class="movie-meta-info">
                        <span th:if="${rated.releaseDate != null}" th:text="${rated.releaseDate.year}">2026</span>
                        <span th:if="${rated.genre != null}" th:text="|• ${rated.genre}|">• Комедия</span>
                        <span th:if="${rated.formattedDuration != null}" th:text="|• ${rated.formattedDuration}|">• 1ч 45мин</span>
                        <span th:if="${rated.director != null and !rated.director.isEmpty()}" th:text="|• Реж. ${rated.director}|">• Реж. Имя</span>
                        <span th:if="${rated.price != null}" th:text="|• ${rated.price} ₽|">• 329 ₽</span>
                    </div>
                </td>
                <td data-label="Моя оценка">
                    <span class="rating-star">★</span>
                    <span class="rating-value" th:text="${rated.ratingValue}">8.5</span> / 10
                </td>
                <td data-label="Мой отзыв">
                    <div class="review-text" th:if="${rated.reviewText != null and !#strings.isEmpty(rated.reviewText)}"
                         th:text="${rated.reviewText}">Отличный фильм!</div>
                    <span th:if="${rated.reviewText == null or #strings.isEmpty(rated.reviewText)}"
                          style="color:#5b6e8c; font-style:italic;">— нет отзыва —</span>
                </td>
                <td data-label="Дата оценки">
                    <span th:text="${#temporals.format(rated.ratedAt, 'dd MMM yyyy, HH:mm')}">15 мар 2026, 18:30</span>
                </td>
                <td data-label="Рейтинг фильма">
                    <span class="rating-star">★</span>
                    <span th:text="${rated.rating != null ? #numbers.formatDecimal(rated.rating, 1, 1) + ' / 10' : '—'}">7.9 / 10</span>
                </td>
            </tr>
            </tbody>
        </table>
        <th:block th:replace="~{fragments/pagination :: pager(page=${ratedHistory}, url='/rated/history')}"></th:block>
    </div>
    <div th:if="${ratedHistory == null or ratedHistory.empty}" class="empty-state">
        <p>Вы ещё не оценили ни одного фильма</p>
        <a href="/" class="btn">Перейти в каталог</a>
    </div>
</main>
<script th:src="@{/js/main.js}" defer></script>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
