<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title th:text="${card.movie.title + ' — Cinema Service'}">Подробнее о фильме — Cinema Service</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <style>
        .movie-details-container{display:grid;grid-template-columns:380px 1fr;gap:3rem;max-width:1100px;margin:3rem auto;padding:2.5rem;background:rgba(15,23,42,0.6);border-radius:32px;border:1px solid rgba(72,187,255,0.2);backdrop-filter:blur(8px);align-items:start;}
        .poster-sidebar{width:100%;}
        .movie-poster-img,.movie-poster-placeholder{width:100%;aspect-ratio:2/3;border-radius:28px;object-fit:cover;box-shadow:0 25px 50px rgba(0,0,0,0.5);}
        .movie-poster-placeholder{background:#2d3748;background-image:linear-gradient(145deg,#2d3748 0%,#1a202c 100%);display:flex;align-items:center;justify-content:center;color:#718096;font-size:1.1rem;}
        .movie-info-block{width:100%;}
        .movie-title{font-size:2.6rem;font-weight:700;line-height:1.2;margin-bottom:0.5rem;background:linear-gradient(135deg,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .movie-meta-actions{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;}
        .rating-block{display:flex;flex-direction:column;}
        .rating-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.5px;color:#94a3b8;margin-bottom:2px;}
        .rating-value{font-size:1.2rem;font-weight:700;color:#fde047;}
        .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin:20px 0;}
        .info-item{background:rgba(255,255,255,0.03);border:1px solid rgba(72,187,255,0.15);border-radius:18px;padding:12px 16px;}
        .info-label{font-size:0.75rem;color:#94a3b8;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.3px;}
        .info-value{font-size:1rem;font-weight:600;color:#eef2ff;}
        .price-section{margin:1.5rem 0;padding:1rem 1.25rem;background:rgba(192,132,252,0.05);border:1px solid rgba(192,132,252,0.2);border-radius:20px;display:inline-block;}
        .price-label{font-size:0.8rem;color:#94a3b8;}
        .price-amount{font-size:2rem;font-weight:700;color:#c084fc;}
        .details-actions{display:flex;gap:1rem;margin-top:1.5rem;flex-wrap:wrap;align-items:center;}
        .icon-btn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px solid rgba(72,187,255,0.25);display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;color:inherit;transition:0.2s;position:relative;text-decoration:none;}
        .icon-btn:hover{transform:scale(1.08);border-color:#f472b6;color:#f472b6;}
        .icon-btn.active{color:#f472b6;border-color:#f472b6;}
        .reviews-badge{font-size:0.7rem;background:var(--glow-primary,#4f46e5);color:white;padding:1px 5px;border-radius:10px;font-weight:600;position:absolute;top:-4px;right:-4px;}
        .cart-button,.buy-now-btn,.bought-btn{padding:0.6rem 1.8rem;border-radius:60px;font-weight:600;font-size:1rem;cursor:pointer;border:none;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:0.2s;white-space:nowrap;}
        .to-cart-btn-details{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:white;}
        .to-cart-btn-details:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(59,130,246,0.4);}
        .in-cart-btn-details{background:linear-gradient(135deg,#10b981,#059669);color:white;}
        .buy-now-btn{background:linear-gradient(135deg,#10b981,#059669);color:white;}
        .buy-now-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,185,129,0.4);}
        .bought-btn{background:#64748b;color:white;cursor:default;opacity:0.8;}
        @media(max-width:850px){.movie-details-container{grid-template-columns:1fr;}.poster-sidebar{max-width:320px;margin:0 auto;}}
    </style>
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>
<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>

<main>
    <div class="movie-details-container" th:data-movie-id="${card.movie.id}">
        <div class="poster-sidebar">
            <img th:if="${card.movie.posterUrl != null and !card.movie.posterUrl.isEmpty()}"
                 th:src="${card.movie.posterUrl}" class="movie-poster-img" alt="Постер" src=""/>
            <div th:unless="${card.movie.posterUrl != null and !card.movie.posterUrl.isEmpty()}"
                 class="movie-poster-placeholder"><span>📽️ Постер отсутствует</span></div>
        </div>
        <div class="movie-info-block">
            <h1 class="movie-title" th:text="${card.movie.title}">Название фильма</h1>
            <div class="movie-meta-actions">
                <div class="rating-block">
                    <span class="rating-label">Средний рейтинг</span>
                    <span class="rating-value js-rating-badge" th:data-movie-id="${card.movie.id}"
                          th:text="${card.movie.rating != null ? '★ ' + #numbers.formatDecimal(card.movie.rating, 1, 1) + ' / 10' : '—'}">—</span>
                </div>
                <button class="icon-btn favourite-btn"
                        th:classappend="${card.status.inFavourites} ? 'active' : ''"
                        th:data-movie-id="${card.movie.id}"
                        th:data-action="${card.status.inFavourites} ? 'remove' : 'add'"
                        onclick="toggleFavourite(this)" title="В избранное">
                    <span th:text="${card.status.inFavourites} ? '♥' : '♡'"></span>
                </button>
                <button class="icon-btn rating-btn"
                        th:data-movie-id="${card.movie.id}"
                        th:data-movie-title="${card.movie.title}"
                        onclick="showRatingModal(this.getAttribute('data-movie-id'), this.getAttribute('data-movie-title'))"
                        title="Оценить фильм">☆
                </button>
                <a th:href="@{/rated/{id}/reviews(id=${card.movie.id})}" class="icon-btn comment-btn"
                   title="Отзывы и комментарии">
                    💬
                    <span th:if="${card.movie.ratingsCount != null and card.movie.ratingsCount > 0}"
                          class="reviews-badge js-reviews-count" th:data-movie-id="${card.movie.id}"
                          th:text="${card.movie.ratingsCount}">0</span>
                </a>
            </div>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Год выпуска</div>
                    <div class="info-value" th:text="${card.movie.releaseDate != null ? #temporals.format(card.movie.releaseDate, 'yyyy') : '-'}">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Жанр</div>
                    <div class="info-value" th:text="${card.movie.genre != null ? card.movie.genre : '-'}">-</div>
                </div>
                <div class="info-item" th:if="${card.movie.director != null}">
                    <div class="info-label">Режиссёр</div>
                    <div class="info-value" th:text="${card.movie.director}">-</div>
                </div>
                <div class="info-item" th:if="${card.movie.formattedDuration != null}">
                    <div class="info-label">Длительность</div>
                    <div class="info-value" th:text="${card.movie.formattedDuration}">-</div>
                </div>
            </div>
            <div class="price-section">
                <div class="price-label">Стоимость покупки</div>
                <div class="price-amount" th:text="${card.movie.price + ' ₽'}">0 ₽</div>
            </div>
            <div class="details-actions">
                <th:block th:if="${session.userForOwnerViewDTO != null}">
                    <button type="button" th:if="${!card.status.bought and !card.status.inCart}"
                            class="cart-button to-cart-btn-details"
                            th:data-movie-id="${card.movie.id}" onclick="addToCart(this)">В корзину</button>
                    <a th:if="${card.status.inCart}" href="/cart" class="cart-button in-cart-btn-details">В корзине →</a>
                    <button th:if="${!card.status.bought}"
                            class="buy-now-btn"
                            th:data-movie-id="${card.movie.id}"
                            th:data-movie-price="${card.movie.price}"
                            th:data-movie-title="${card.movie.title}"
                            onclick="showBuyModal(this)">Купить сейчас</button>
                    <button th:if="${card.status.bought}" class="bought-btn" disabled>Куплено</button>
                </th:block>
                <th:block th:unless="${session.userForOwnerViewDTO != null}">
                    <a th:href="@{/login}" class="cart-button to-cart-btn-details" onclick="return requireAuth(event, this.href)">В корзину</a>
                    <a th:href="@{/login}" class="buy-now-btn" onclick="return requireAuth(event, this.href)">Купить сейчас</a>
                </th:block>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/modals :: buyModal}"></th:block>
<th:block th:replace="~{fragments/modals :: ratingModal}"></th:block>
<th:block th:replace="~{fragments/modals :: confirmDeleteModal}"></th:block>

<script th:src="@{/js/main.js}" defer></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const container = document.querySelector('.movie-details-container');
        if (container) {
            const movieId = container.getAttribute('data-movie-id');
            if (movieId) updateReviewsCount(movieId);
        }
    });
    window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
            const container = document.querySelector('.movie-details-container');
            if (container) {
                const movieId = container.getAttribute('data-movie-id');
                if (movieId) updateReviewsCount(movieId);
            }
        }
    });
</script>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
