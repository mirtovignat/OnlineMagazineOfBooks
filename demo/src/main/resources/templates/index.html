<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>Каталог — Cinema Service</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <style>
        .catalog-header{text-align:center;padding:0.75rem 1rem;}
        .catalog-header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#e0e7ff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0;}
        .catalog-wrapper .movies-grid{padding-top:0;}
    </style>
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>
<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>

<main class="catalog-wrapper">
    <div class="catalog-header">
        <h1>Каталог фильмов</h1>
    </div>

    <div class="movies-grid" th:if="${cardsPage != null and !cardsPage.empty}">
        <div class="movie-card" th:each="card : ${cardsPage.content}" th:data-movie-id="${card.movie.id}">
            <a class="movie-poster-link" th:href="@{/movies/{id}(id=${card.movie.id})}">
                <img th:if="${card.movie.posterUrl != null and !card.movie.posterUrl.isEmpty()}"
                     th:src="${card.movie.posterUrl}" alt="Постер" class="movie-poster-img" src=""/>
                <div th:unless="${card.movie.posterUrl != null and !card.movie.posterUrl.isEmpty()}"
                     class="movie-poster-placeholder"><span>📽️ Постер</span></div>
            </a>

            <div class="movie-card-content">
                <h3 class="movie-card-title">
                    <a th:href="@{/movies/{id}(id=${card.movie.id})}" th:text="${card.movie.title}">Название</a>
                </h3>

                <div class="badges">
                    <span class="badge rating js-rating-badge" th:data-movie-id="${card.movie.id}"
                          th:text="${card.movie.rating != null ? 'Рейтинг: ★ ' + #numbers.formatDecimal(card.movie.rating, 1, 1) : 'Рейтинг: —'}">Рейтинг: ★ -</span>
                    <span class="badge year" th:if="${card.movie.releaseYear != null}"
                          th:text="'Год: ' + ${card.movie.releaseYear}">Год: 2024</span>
                    <span class="badge genre" th:if="${card.movie.genre != null}"
                          th:text="'Жанр: ' + ${card.movie.genre}">Жанр: Комедия</span>
                </div>

                <div class="price" th:text="${card.movie.price + ' ₽'}">0 ₽</div>

                <div class="movie-actions">
                    <button class="icon-btn favourite-btn"
                            th:classappend="${card.status.inFavourites} ? 'active' : ''"
                            th:data-movie-id="${card.movie.id}"
                            th:data-action="${card.status.inFavourites} ? 'remove' : 'add'"
                            onclick="toggleFavourite(this)" title="Избранное">
                        <span th:text="${card.status.inFavourites} ? '♥' : '♡'"></span>
                    </button>

                    <button class="icon-btn rating-btn"
                            th:data-movie-id="${card.movie.id}"
                            th:data-movie-title="${card.movie.title}"
                            onclick="showRatingModal(this.getAttribute('data-movie-id'), this.getAttribute('data-movie-title'))"
                            title="Оценить">☆
                    </button>

                    <a th:href="@{/rated/{id}/reviews(id=${card.movie.id})}" class="icon-btn comment-btn"
                       title="Отзывы">
                        💬
                        <span class="reviews-badge js-reviews-count"
                              th:data-movie-id="${card.movie.id}"
                              th:text="${card.movie.ratingsCount}"
                              th:style="${card.movie.ratingsCount > 0} ? '' : 'display:none'">
                        </span>
                    </a>
                </div>

                <div class="purchase-buttons">
                    <th:block th:if="${session.userForOwnerViewDTO != null}">
                        <button type="button" th:if="${!card.status.bought and !card.status.inCart}"
                                class="cart-button to-cart-btn-details"
                                th:data-movie-id="${card.movie.id}"
                                onclick="addToCart(this)">В корзину
                        </button>
                        <a th:if="${card.status.inCart}" href="/cart" class="cart-button in-cart-btn-details">В корзине →</a>
                        <button th:if="${!card.status.bought}"
                                class="buy-now-btn"
                                th:data-movie-id="${card.movie.id}"
                                th:data-movie-price="${card.movie.price}"
                                th:data-movie-title="${card.movie.title}"
                                onclick="showBuyModal(this)">Купить сейчас
                        </button>
                        <button th:if="${card.status.bought}" class="bought-btn" disabled>Куплено</button>
                    </th:block>
                    <th:block th:unless="${session.userForOwnerViewDTO != null}">
                        <a th:href="@{/login}" class="cart-button to-cart-btn-details" onclick="return requireAuth(event, this.href)">В корзину</a>
                        <a th:href="@{/login}" class="buy-now-btn" onclick="return requireAuth(event, this.href)">Купить сейчас</a>
                    </th:block>
                </div>
            </div>
        </div>
    </div>

    <div class="empty-catalog" th:unless="${cardsPage != null and !cardsPage.empty}">
        Фильмы не найдены
    </div>

    <th:block th:replace="~{fragments/pagination :: pager(page=${cardsPage}, url='/')}"></th:block>
</main>

<th:block th:replace="~{fragments/modals :: buyModal}"></th:block>
<th:block th:replace="~{fragments/modals :: ratingModal}"></th:block>

<script th:src="@{/js/main.js}" defer></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.js-reviews-count[data-movie-id]').forEach(el => {
            const id = el.getAttribute('data-movie-id');
            if (id) updateReviewsCount(id);
        });
    });
    window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
            document.querySelectorAll('.js-reviews-count[data-movie-id]').forEach(el => {
                const id = el.getAttribute('data-movie-id');
                if (id) updateReviewsCount(id);
            });
        }
    });
</script>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
