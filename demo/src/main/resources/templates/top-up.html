<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Пополнение кошелька — Cinema Service</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 10% 20%, #0b0f1c, #05070f);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            font-family: 'Inter', system-ui, sans-serif;
            color: #eef2ff;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .deposit-container {
            max-width: 420px;
            width: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(72, 187, 255, 0.25);
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .deposit-header {
            background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(168,85,247,0.2));
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid rgba(72, 187, 255, 0.25);
        }
        .deposit-header .logo-link {
            text-decoration: none;
            color: #e2e8f0;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 1.05rem;
        }
        .deposit-header .logo-link img {
            width: 22px;
            height: 22px;
            border-radius: 6px;
        }
        .deposit-header h2 {
            font-size: 1.25rem;
            margin-top: 0.2rem;
            background: linear-gradient(135deg, #e0e7ff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }
        .deposit-body {
            padding: 1.25rem 1.25rem 1.5rem;
        }
        .balance-info {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(72, 187, 255, 0.25);
            border-radius: 16px;
            padding: 0.6rem 1rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .balance-label {
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .balance-amount {
            color: #e2e8f0;
            font-size: 1.45rem;
            font-weight: 700;
        }
        .balance-amount .currency {
            color: #c084fc;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }
        .amount-input {
            position: relative;
        }
        .currency-symbol {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-weight: 600;
            font-size: 1rem;
        }
        .amount-input input {
            width: 100%;
            padding: 0.6rem 1.1rem 0.6rem 2.5rem;
            border-radius: 60px;
            border: 1px solid rgba(72, 187, 255, 0.25);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1.05rem;
            text-align: right;
            transition: 0.2s;
        }
        .amount-input input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
        }
        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.4rem;
            margin-bottom: 1.25rem;
        }
        .quick-amount-btn {
            padding: 0.45rem 0.2rem;
            border-radius: 40px;
            border: 1px solid rgba(72, 187, 255, 0.25);
            background: rgba(255,255,255,0.05);
            color: #e2e8f0;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .quick-amount-btn:hover {
            background: rgba(59,130,246,0.15);
            border-color: #3b82f6;
        }
        .quick-amount-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .payment-methods {
            margin-bottom: 1.25rem;
        }
        .payment-methods h3 {
            color: #94a3b8;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }
        .payment-option {
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-radius: 60px;
            border: 1px solid rgba(72, 187, 255, 0.25);
            background: rgba(255,255,255,0.02);
            margin-bottom: 0.4rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .payment-option:hover {
            background: rgba(255,255,255,0.05);
            border-color: #3b82f6;
        }
        .payment-option.selected {
            border-color: #3b82f6;
            background: rgba(59,130,246,0.1);
        }
        .payment-option input[type="radio"] {
            accent-color: #3b82f6;
            margin-right: 0.6rem;
            width: 1rem;
            height: 1rem;
            flex-shrink: 0;
        }
        .payment-icon {
            font-size: 1.2rem;
            margin-right: 0.6rem;
        }
        .payment-info h4 {
            color: #e2e8f0;
            font-size: 0.85rem;
            font-weight: 600;
            margin: 0;
        }
        .payment-info p {
            color: #94a3b8;
            font-size: 0.72rem;
            margin: 0;
        }
        .form-actions {
            display: flex;
            gap: 0.75rem;
        }
        .btn-menu, .btn-confirm {
            flex: 1;
            padding: 0.65rem 1rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-menu {
            background: rgba(255,255,255,0.06);
            color: #e2e8f0;
            border: 1px solid rgba(72, 187, 255, 0.25);
        }
        .btn-menu:hover {
            background: rgba(255,255,255,0.12);
        }
        .btn-confirm {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        .btn-confirm:hover {
            box-shadow: 0 4px 12px rgba(16,185,129,0.3);
        }
        .error-message {
            color: #f43f5e;
            font-size: 0.7rem;
            margin-top: 0.2rem;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .has-error {
            border-color: #f43f5e !important;
        }
        .flash-message {
            margin: 0 1.25rem 0.75rem;
            border-radius: 10px;
        }
        @media (max-width: 480px) {
            body { padding: 1rem 0.5rem; }
            .deposit-body { padding: 1rem 0.75rem; }
            .quick-amounts { grid-template-columns: repeat(2, 1fr); }
            .form-actions { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>
<body>
<main>
    <div class="deposit-container">
        <div class="deposit-header">
            <a href="/" class="logo-link">
                <img src="/favicon.ico" alt="Logo" th:src="@{/favicon.ico}">
                <span>Cinema Service</span>
            </a>
            <h2>Пополнение кошелька</h2>
        </div>

        <th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>

        <div class="deposit-body">
            <div class="balance-info">
                <div class="balance-label">Текущий баланс</div>
                <div class="balance-amount">
                    <span th:text="${wallet.balance}"></span>
                    <span class="currency" th:text="${wallet.currencyCode}"></span>
                </div>
            </div>

            <form th:action="@{/wallet/top-up}" th:object="${topUpFormDTO}" method="post" id="depositForm">
                <div class="form-group">
                    <label for="amount">Сумма пополнения</label>
                    <div class="amount-input">
                        <span class="currency-symbol"
                              th:text="${wallet.currencyCode == 'RUB' ? '₽' : (wallet.currencyCode == 'USD' ? '$' : '€')}"></span>
                        <input type="number" id="amount" th:field="*{amount}" min="0.01" step="0.01" placeholder="0.00"
                               th:classappend="${#fields.hasErrors('amount')} ? 'has-error' : ''">
                    </div>
                    <div th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" class="error-message show"></div>
                    <div class="error-message" id="amountError"></div>
                </div>

                <div class="quick-amounts">
                    <button type="button" class="quick-amount-btn" data-amount="100">100</button>
                    <button type="button" class="quick-amount-btn" data-amount="500">500</button>
                    <button type="button" class="quick-amount-btn" data-amount="1000">1 000</button>
                    <button type="button" class="quick-amount-btn" data-amount="5000">5 000</button>
                </div>

                <div class="payment-methods">
                    <h3>Способ оплаты</h3>
                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="CARD" checked>
                        <span class="payment-icon">💳</span>
                        <div class="payment-info">
                            <h4>Банковская карта</h4>
                            <p>Visa, Mastercard, Мир</p>
                        </div>
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="QIWI">
                        <span class="payment-icon">📱</span>
                        <div class="payment-info">
                            <h4>QIWI Кошелек</h4>
                            <p>Мгновенное пополнение</p>
                        </div>
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="YANDEX_MONEY">
                        <span class="payment-icon">💰</span>
                        <div class="payment-info">
                            <h4>ЮMoney</h4>
                            <p>Быстрый перевод</p>
                        </div>
                    </label>
                </div>

                <div class="form-actions">
                    <a href="/" class="btn-menu">В меню</a>
                    <button type="submit" class="btn-confirm">Пополнить</button>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script>
    document.querySelectorAll('.quick-amount-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const amount = this.getAttribute('data-amount');
            document.getElementById('amount').value = amount;
            document.querySelectorAll('.quick-amount-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });

    document.querySelectorAll('.payment-option input').forEach(radio => {
        radio.addEventListener('change', function() {
            document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('selected'));
            this.closest('.payment-option').classList.add('selected');
        });
        if (radio.checked) radio.closest('.payment-option').classList.add('selected');
    });

    document.getElementById('depositForm').addEventListener('submit', function(e) {
        const amountInput = document.getElementById('amount');
        const amountError = document.getElementById('amountError');
        let isValid = true;
        amountError.classList.remove('show');
        amountInput.classList.remove('has-error');
        const amount = parseFloat(amountInput.value);
        if (!amount || amount < 0.01) {
            amountError.textContent = 'Минимальная сумма пополнения: 0.01';
            amountError.classList.add('show');
            amountInput.classList.add('has-error');
            isValid = false;
        }
        if (!isValid) e.preventDefault();
    });

    document.getElementById('amount').focus();

    setTimeout(() => {
        document.querySelectorAll('.flash-message').forEach(msg => {
            msg.style.transition = 'opacity 0.5s ease';
            msg.style.opacity = '0';
            setTimeout(() => msg.remove(), 500);
        });
    }, 5000);
</script>
</body>
</html>
